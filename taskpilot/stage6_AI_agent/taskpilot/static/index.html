<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPilot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>TaskPilot</h1>

  <div id="auth-section">
    <form id="auth-form">
      <input id="username-input" type="text" placeholder="Username" required>
      <input id="password-input" type="password" placeholder="Password" required>
      <button type="submit" id="login-btn">Log in</button>
      <button type="button" id="register-btn">Register</button>
    </form>
    <p id="auth-message" class="meta"></p>
  </div>

  <div id="app-section" style="display:none;">
    <div class="topbar">
      <span id="whoami" class="meta"></span>
      <button id="logout-btn">Log out</button>
    </div>

    <form id="quick-add-form">
      <input id="quick-add-input" type="text" placeholder="Quick add: 'meditate every morning'...">
      <button type="submit">✨ Suggest</button>
    </form>

    <form id="task-form">
      <input id="name-input" type="text" placeholder="New task or habit..." required>
      <select id="kind-input">
        <option value="task">Task</option>
        <option value="habit">Habit</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div id="task-list"></div>
    <div id="stats"></div>

    <div id="summary-section">
      <button id="summary-btn">Get AI weekly summary</button>
      <p id="summary-text" class="meta"></p>
    </div>

    <div id="plan-section">
      <button id="plan-btn">🧭 What should I focus on today?</button>
      <p id="plan-text" class="meta"></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
